[package]
name = "hale"
version = "0.1.30"
edition = "2021"
license = "MIT"
description = "Instant network connection quality monitor"
repository = "https://github.com/adamatan/hale"
homepage = "https://github.com/adamatan/hale"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "signal", "io-util"] }
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
futures = "0.3"
default-net = "0.22"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "adamatan/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
