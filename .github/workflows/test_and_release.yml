name: Test and Release

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint with clippy
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install release-plz (Manual)
        run: |
          curl -L -o release-plz.tar.gz https://github.com/MarcoIeni/release-plz/releases/latest/download/release-plz-x86_64-unknown-linux-gnu.tar.gz
          tar xf release-plz.tar.gz
          sudo mv release-plz /usr/local/bin/
          rm release-plz.tar.gz

      - name: Run CI Checks
        run: |
          cargo test
          cargo clippy -- -D warnings

      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          release-plz update --verbose
          if [[ -n $(git status -s) ]]; then
            echo "Changes detected. Preparing release..."
            git add .
            git commit -m "chore: release"
            git push origin main
          fi
          release-plz release --verbose --git-token "${{ secrets.GITHUB_TOKEN }}" --backend github

  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: |
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build release binary
        run: cargo build --release

      - name: Build .deb package
        run: cargo deb --no-build

      - name: Upload .deb to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEB_FILE=$(ls target/debian/*.deb)
          gh release upload ${{ steps.get_tag.outputs.tag }} "$DEB_FILE"

  test-deb:
    name: Test Debian Package Installation
    runs-on: ubuntu-latest
    needs: build-deb
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Get latest tag
        id: get_tag
        run: |
          curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | \
            jq -r '.tag_name' > tag.txt
          echo "tag=$(cat tag.txt)" >> $GITHUB_OUTPUT

      - name: Download .deb from release
        run: |
          TAG=${{ steps.get_tag.outputs.tag }}
          DEB_NAME="hale_${TAG#v}_amd64.deb"
          wget "https://github.com/${{ github.repository }}/releases/download/$TAG/$DEB_NAME"

      - name: Install .deb package
        run: |
          sudo dpkg -i hale_*.deb || true
          sudo apt-get install -f -y

      - name: Verify installation
        run: |
          which hale
          hale --version
          hale --help

      - name: Test basic functionality
        run: |
          timeout 5s hale --check --verbose || [ $? -eq 124 ]
